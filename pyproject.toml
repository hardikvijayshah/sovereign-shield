[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sovereign-shield"
version = "0.1.0"
description = "AI agent for continuous AWS data sovereignty compliance scanning"
requires-python = ">=3.10"
dependencies = [
    "strands-agents>=1.0.0",
    "strands-agents-tools>=0.1.0",
    "boto3>=1.35.0",
    "pydantic>=2.0.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "moto[all]>=5.0.0",
    "ruff>=0.4.0",
]
ui = [
    "streamlit>=1.36.0",
    "requests>=2.31.0",
]
cdk = [
    "aws-cdk-lib>=2.150.0",
    "constructs>=10.0.0",
]

[project.scripts]
sovereign-shield = "sovereign_shield.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.ruff.lint.per-file-ignores]
# Regulation text and remediation prose are kept as whole sentences so they can
# be reviewed against their sources; only line length is exempt.
"src/sovereign_shield/regulations.py" = ["E501"]
"src/sovereign_shield/tools/remediation.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
